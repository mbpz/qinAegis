name: Publish Homebrew Formula
on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  publish-tap:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify service archives
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v2\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          mkdir -p artifacts
          cd artifacts
          BASE="https://github.com/mbpz/qinAegis/releases/download/$RELEASE_TAG"
          curl --proto '=https' --tlsv1.2 -fSL "$BASE/SHA256SUMS" -o SHA256SUMS
          for TARGET in aarch64-apple-darwin x86_64-apple-darwin x86_64-unknown-linux-gnu; do
            NAME="qinaegis-$TARGET.tar.gz"
            curl --proto '=https' --tlsv1.2 -fSL "$BASE/$NAME" -o "$NAME"
            awk -v name="$NAME" '$2 == name' SHA256SUMS > check.txt
            test "$(wc -l < check.txt)" -eq 1
            sha256sum -c check.txt
          done
      - name: Render verified Formula
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          version = os.environ['RELEASE_TAG'][1:]
          content = pathlib.Path('Formula/qinAegis.rb').read_text()
          checks = dict(line.split()[::-1] for line in pathlib.Path('artifacts/SHA256SUMS').read_text().splitlines())
          content = content.replace('RELEASE_VERSION', version)
          for token, target in [('ARM', 'aarch64-apple-darwin'), ('INTEL', 'x86_64-apple-darwin'), ('LINUX', 'x86_64-unknown-linux-gnu')]:
              digest = checks[f'qinaegis-{target}.tar.gz']
              assert re.fullmatch('[0-9a-f]{64}', digest)
              content = content.replace(f'RELEASE_{token}_SHA256', digest)
          pathlib.Path('qinaegis.rb').write_text(content)
          PY
      - name: Push Formula to tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          gh repo clone mbpz/homebrew-qinAegis tap-repo
          mkdir -p tap-repo/Formula
          cp qinaegis.rb tap-repo/Formula/qinaegis.rb
          cd tap-repo
          git config user.name ttbb
          git config user.email apples398@163.com
          git add Formula/qinaegis.rb
          git diff --cached --quiet && exit 0
          git commit -m "Keep Homebrew aligned with the verified local Web release" -m "Related: $RELEASE_TAG"
          git push
