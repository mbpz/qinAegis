name: Release local Web service
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'codex/qinaegis-2.0']
    tags: ['v2.*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ startsWith(github.ref, 'refs/tags/') && 'tag' || 'branch' }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  engine-checks:
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install locked execution engine dependencies
        working-directory: sandbox
        run: npx --yes pnpm@11.24.0 install --frozen-lockfile
      - name: Validate execution engine without external models
        working-directory: sandbox
        run: |
          npx --yes pnpm@11.24.0 run typecheck
          npx --yes pnpm@11.24.0 test
          npx --yes pnpm@11.24.0 run build
      - name: Verify owned browser isolation without external models
        working-directory: sandbox
        run: |
          npx --yes pnpm@11.24.0 exec playwright install --with-deps chromium
          npx --yes pnpm@11.24.0 run test:browser
      - uses: actions/download-artifact@v4
        with:
          name: qinaegis-x86_64-unknown-linux-gnu
          path: build/allure-check
      - name: Standalone runtime packaging and installer regressions
        run: |
          python3 scripts/test-runtime-package.py
          python3 scripts/test-runtime-install.py
      - name: Build and relocate standalone runtime
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/pnpm-bin"
          printf '#!/bin/sh\nexec npx --yes pnpm@11.24.0 "$@"\n' > "$RUNNER_TEMP/pnpm-bin/pnpm"
          chmod +x "$RUNNER_TEMP/pnpm-bin/pnpm"
          PATH="$RUNNER_TEMP/pnpm-bin:$PATH" python3 scripts/build-runtime.py
          python3 scripts/test-runtime-package.py --archive build/runtime/qinaegis-runtime-linux-x86_64.tar.gz --browser-test
      - uses: actions/upload-artifact@v4
        with:
          name: standalone-runtime-linux-candidate
          path: build/runtime/*
          if-no-files-found: error
          retention-days: 14
      - name: Validate native runtime switching and official Allure through the packaged local service
        shell: bash
        run: |
          tar -xzf build/allure-check/qinaegis-x86_64-unknown-linux-gnu.tar.gz -C build/allure-check
          python3 scripts/test-native-runtime.py "$PWD/build/allure-check/qinaegis" --archive build/runtime/qinaegis-runtime-linux-x86_64.tar.gz --exercise-switches
          python3 scripts/test-allure.py "$PWD/build/allure-check/qinaegis"
          python3 scripts/test-browser-install.py "$PWD/build/allure-check/qinaegis" --archive build/runtime/qinaegis-runtime-linux-x86_64.tar.gz --browser-cache "$HOME/.cache/ms-playwright"
  build:
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos-26, target: aarch64-apple-darwin}
          - {os: macos-15-intel, target: x86_64-apple-darwin}
          - {os: ubuntu-22.04, target: x86_64-unknown-linux-gnu}
          - {os: windows-2022, target: x86_64-pc-windows-msvc}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: crates/web_client/ui/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          cache-on-failure: true
      - name: Check 2.0 versions and release tag
        shell: bash
        env:
          RELEASE_REF: ${{ github.ref }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python scripts/release-assets.py check
          python scripts/test-release-assets.py
          if [[ "$RELEASE_REF" == refs/tags/* ]]; then
            python scripts/release-assets.py check --tag "$RELEASE_TAG"
          fi
      - name: Build embedded UI and executable archive
        shell: bash
        run: bash scripts/build-release.sh '${{ matrix.target }}'
      - name: UI regressions
        working-directory: crates/web_client/ui
        run: npm test
      - name: Rust workspace regressions
        shell: bash
        run: QINAEGIS_DATA_DIR="$(python -c 'import tempfile; print(tempfile.mkdtemp(prefix="qinaegis-ci-tests-"))')" cargo test --workspace --locked
      - name: Local Web release smoke
        timeout-minutes: 5
        shell: bash
        env:
          RELEASE_TARGET: ${{ matrix.target }}
          PYTHONUNBUFFERED: '1'
        run: |
          SUFFIX=""
          if [[ "$RUNNER_OS" == "Windows" ]]; then SUFFIX=".exe"; fi
          BINARY="$PWD/target/$RELEASE_TARGET/release/qinaegis$SUFFIX"
          if [[ "$RUNNER_OS" == "Windows" ]]; then BINARY="$(cygpath -w "$BINARY")"; fi
          python scripts/test-local-web.py "$BINARY"
          python scripts/test-native-runtime.py "$BINARY"
          echo "::group::Contract generation smoke"
          python scripts/test-contract-generation.py "$BINARY"
          echo "::endgroup::"
          echo "::group::Contract execution smoke"
          python scripts/test-contract-execution.py "$BINARY"
          echo "::endgroup::"
          python scripts/test-case-assets.py "$BINARY"
          python scripts/test-flows.py "$BINARY"
          python scripts/test-flow-execution.py "$BINARY"
          python scripts/test-model-protocols.py "$BINARY"
          python scripts/test-generation-evidence.py "$BINARY"
          python scripts/test-legacy-generation.py "$BINARY"
          python scripts/test-contract-correction.py "$BINARY"
          python scripts/test-environment.py "$BINARY"
          python scripts/test-task-history.py "$BINARY"
          python scripts/test-report-maintenance.py "$BINARY"
          python scripts/test-config-migration.py "$BINARY"
      - name: Offline user-local installer regressions
        if: runner.os != 'Windows'
        run: python scripts/test-install.py
      - name: Windows user-local installer acceptance with actual service
        if: runner.os == 'Windows'
        shell: pwsh
        run: python scripts/test-windows-install.py "$PWD/target/${{ matrix.target }}/release/qinaegis.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: qinaegis-${{ matrix.target }}
          path: build/qinaegis-*
          if-no-files-found: error
          retention-days: 14
  assemble:
    needs: [build, engine-checks]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: qinaegis-*
          merge-multiple: true
          path: release
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate complete release and checksum every asset
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: python3 scripts/release-assets.py bundle --directory release
      - uses: actions/upload-artifact@v4
        with:
          name: distribution-candidate
          path: release/*
          if-no-files-found: error
          retention-days: 14
  release:
    permissions:
      contents: write
    needs: assemble
    if: startsWith(github.ref, 'refs/tags/v2.')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distribution-candidate
          path: release
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          generate_release_notes: true
          files: release/*
