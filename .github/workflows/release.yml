name: Release local Web service
on:
  push:
    tags: ['v2.*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos-14, target: aarch64-apple-darwin}
          - {os: macos-15-intel, target: x86_64-apple-darwin}
          - {os: ubuntu-22.04, target: x86_64-unknown-linux-gnu}
          - {os: windows-latest, target: x86_64-pc-windows-msvc}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build embedded UI and executable archive
        shell: bash
        run: bash scripts/build-release.sh '${{ matrix.target }}'
      - name: UI regressions
        working-directory: crates/web_client/ui
        run: npm test
      - name: Rust workspace regressions
        run: cargo test --workspace --locked
      - name: Local Web release smoke
        shell: bash
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          SUFFIX=""
          if [[ "$RUNNER_OS" == "Windows" ]]; then SUFFIX=".exe"; fi
          python scripts/test-local-web.py "$PWD/target/$RELEASE_TARGET/release/qinaegis$SUFFIX"
      - name: Offline user-local installer regressions
        if: runner.os != 'Windows'
        run: python scripts/test-install.py
      - uses: actions/upload-artifact@v4
        with:
          name: qinaegis-${{ matrix.target }}
          path: build/qinaegis-*
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v2.')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: qinaegis-*
          merge-multiple: true
          path: release
      - name: Generate checksums
        working-directory: release
        run: sha256sum qinaegis-* > SHA256SUMS
      - name: Include installer
        run: cp scripts/install.sh release/install.sh
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: release/*
