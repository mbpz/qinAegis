name: Verify 2.0 progress
on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: roadmap-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install locked frontend dependencies
        working-directory: crates/web_client/ui
        run: npm ci
      - name: Verify source and build regressions
        run: bash scripts/roadmap-check.sh > roadmap-status.md
      - name: Publish check summary
        if: always()
        run: |
          if [ -f roadmap-status.md ]; then cat roadmap-status.md >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Upload status and diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roadmap-status
          path: |
            roadmap-status.md
            build/roadmap-check/*.log
          if-no-files-found: warn
          retention-days: 14
