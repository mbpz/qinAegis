<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#283593"/>
      <stop offset="100%" style="stop-color:#0D1642"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00E5FF"/>
      <stop offset="100%" style="stop-color:#00BCD4"/>
    </linearGradient>
    <radialGradient id="glassGrad" cx="35%" cy="30%" r="65%">
      <stop offset="0%" style="stop-color:#E0F7FA;stop-opacity:0.95"/>
      <stop offset="50%" style="stop-color:#80DEEA;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#00BCD4;stop-opacity:0.35"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowStrong" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Full canvas background -->
  <rect width="512" height="512" fill="#1A237E"/>

  <!-- Shield + magnifier centered in 512x512 canvas -->
  <!-- Total content: y from ~70 to ~442, x from ~66 to ~446, centered at 256,256 -->
  <g transform="translate(256, 256)">

    <!-- Shield body - centered so visual center is at 256,256 -->
    <path d="M0 -130 L130 -60 Q150 -42 150 -8 L150 48 Q150 102 90 142 L0 180 L-90 142 Q-150 102 -150 48 L-150 -8 Q-150 -42 -130 -60 Z"
          fill="url(#shieldGrad)" stroke="#00BCD4" stroke-width="4"/>

    <!-- Inner rim -->
    <path d="M0 -115 L115 -48 Q132 -32 132 -5 L132 44 Q132 92 80 127 L0 162 L-80 127 Q-132 92 -132 44 L-132 -5 Q-132 -32 -115 -48 Z"
          fill="none" stroke="#00E5FF" stroke-width="1.5" stroke-opacity="0.5"/>

    <!-- Magnifier centered in shield -->
    <g transform="rotate(-20)">
      <!-- Glow ring -->
      <circle cx="0" cy="0" r="55" fill="none" stroke="#00E5FF" stroke-width="1.5" filter="url(#glowStrong)" stroke-opacity="0.6"/>
      <!-- Main ring -->
      <circle cx="0" cy="0" r="50" fill="none" stroke="url(#cyanGrad)" stroke-width="9" filter="url(#glow)"/>
      <circle cx="0" cy="0" r="50" fill="none" stroke="#00E5FF" stroke-width="2.5"/>
      <!-- Glass -->
      <circle cx="0" cy="0" r="43" fill="url(#glassGrad)"/>

      <!-- Checklist inside glass -->
      <g transform="translate(-32, -16)">
        <rect width="64" height="14" rx="2" fill="#1A237E" fill-opacity="0.7"/>
        <polyline points="3,7 6,10 12,4" fill="none" stroke="#00E676" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="17" y="4" width="40" height="5" rx="1.5" fill="#00BCD4" fill-opacity="0.8"/>
      </g>
      <g transform="translate(-32, 3)">
        <rect width="64" height="14" rx="2" fill="#1A237E" fill-opacity="0.7"/>
        <polyline points="3,7 6,10 12,4" fill="none" stroke="#00E676" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="17" y="4" width="30" height="5" rx="1.5" fill="#00BCD4" fill-opacity="0.8"/>
      </g>
      <g transform="translate(-32, 22)">
        <rect width="64" height="14" rx="2" fill="#1A237E" fill-opacity="0.4"/>
        <circle cx="8" cy="7" r="4" fill="none" stroke="#607D8B" stroke-width="1.5"/>
        <rect x="17" y="4" width="36" height="5" rx="1.5" fill="#607D8B" fill-opacity="0.5"/>
      </g>
    </g>

    <!-- Handle -->
    <g transform="rotate(-20)">
      <rect x="42" y="54" width="12" height="42" rx="6" fill="#263238" stroke="#00BCD4" stroke-width="2"/>
      <line x1="44.5" y1="62" x2="51.5" y2="62" stroke="#00BCD4" stroke-width="1.5" stroke-opacity="0.7"/>
      <line x1="44.5" y1="68" x2="51.5" y2="68" stroke="#00BCD4" stroke-width="1.5" stroke-opacity="0.7"/>
      <line x1="44.5" y1="74" x2="51.5" y2="74" stroke="#00BCD4" stroke-width="1.5" stroke-opacity="0.7"/>
    </g>

    <!-- Circuit node at top -->
    <circle cx="0" cy="-105" r="7" fill="#00E5FF" filter="url(#glowStrong)"/>
    <circle cx="0" cy="-105" r="3.5" fill="#FFFFFF"/>
    <line x1="0" y1="-98" x2="0" y2="-78" stroke="#00BCD4" stroke-width="2"/>
    <line x1="0" y1="-78" x2="-28" y2="-60" stroke="#00BCD4" stroke-width="1.5" stroke-opacity="0.7"/>
    <line x1="0" y1="-78" x2="28" y2="-60" stroke="#00BCD4" stroke-width="1.5" stroke-opacity="0.7"/>
    <circle cx="-28" cy="-60" r="3" fill="#00BCD4"/>
    <circle cx="28" cy="-60" r="3" fill="#00BCD4"/>
  </g>
</svg>